apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.example.driver'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.driver"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ✅ READ MAPS API KEY SAFELY FROM local.properties
        def mapsApiKey = project.findProperty("MAPS_API_KEY") ?: ""
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsApiKey}\""
    }

    // ✅ REQUIRED
    buildFeatures {
        compose true
        buildConfig true
    }

    // ✅ COMPOSE CONFIG (FIXES YOUR ERROR)
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {

    // 🔹 Compose
    implementation platform("androidx.compose:compose-bom:2024.01.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.8.2"

    // 🔹 Google Maps & Location
    implementation "com.google.android.gms:play-services-maps:18.2.0"
    implementation "com.google.android.gms:play-services-location:21.0.1"

    // 🔹 Firebase
    implementation platform("com.google.firebase:firebase-bom:32.7.0")
    implementation "com.google.firebase:firebase-database-ktx"
    implementation "com.google.firebase:firebase-messaging-ktx"

    // 🔹 Networking
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    dependencies {
        implementation("androidx.core:core-ktx:1.12.0")
        implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")

        implementation("com.android.volley:volley:1.2.1") // ✅ ADD THIS
    }

}
